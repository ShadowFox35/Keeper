name: keeper

packages:
  - core
  - core_ui
  - data
  - domain
  - navigation
  - features/home
  - features/profile
  - features/scanner
  - features/settings

scripts:
  clean:
    flutter clean &&
    melos clean

  bootstrap:
    flutter pub get &&
    melos bootstrap

  setup:
    melos run bootstrap &&
    melos run generate_localization &&
    melos run build_runner

  build_runner:
    melos exec --depends-on="build_runner" -- dart run build_runner build -d

  generate_localization:
    melos exec --scope="core" -- flutter pub run easy_localization:generate -h &&
    melos exec --scope="core" -- dart run easy_localization:generate -f keys -o locale_keys.g.dart -O lib/src/localization/generated -S resources/lang
